<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الگوساز کودک</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2B2118">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF6EE; --grid:#E4DCC8; --ink:#2B2118; --ink-soft:#6B5F4F;
    --thread:#B3452F; --teal:#2F5D55; --panel:#FFFFFF; --line:#E2D9C4;
    --sidebar:#22201B; --fabric:#EFE6D3;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Vazirmatn',sans-serif; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --paper:#1E1B16; --grid:#332C22; --ink:#EFE7D8; --ink-soft:#B9AD97;
      --thread:#E08A6F; --teal:#6FB3A6; --panel:#2A251E; --line:#3B342A; --sidebar:#151310; --fabric:#3A3226; } }
  :root[data-theme="dark"]{ --paper:#1E1B16; --grid:#332C22; --ink:#EFE7D8; --ink-soft:#B9AD97;
    --thread:#E08A6F; --teal:#6FB3A6; --panel:#2A251E; --line:#3B342A; --sidebar:#151310; --fabric:#3A3226; }

  .app{ display:flex; height:100%; min-height:100vh; }
  .sidebar{ width:220px; flex:none; background:var(--sidebar); color:#EFE7D8; display:flex; flex-direction:column; padding:18px 0; }
  .brand{ padding:0 20px 18px; border-bottom:1px solid rgba(255,255,255,.08); margin-bottom:10px; }
  .brand .mark{ font-size:1.4rem; }
  .brand h1{ font-size:1rem; margin:6px 0 2px; font-weight:700; }
  .brand p{ font-size:.72rem; color:#B9AD97; margin:0; }
  nav{ display:flex; flex-direction:column; gap:2px; padding:6px 10px; }
  .navitem{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; cursor:pointer;
    color:#D8CFBC; font-size:.86rem; border:none; background:none; font-family:'Vazirmatn',sans-serif; text-align:right; width:100%; }
  .navitem svg{ width:17px; height:17px; flex:none; opacity:.85; }
  .navitem:hover{ background:rgba(255,255,255,.06); }
  .navitem.active{ background:var(--thread); color:#fff; }
  .navitem.active svg{ opacity:1; }

  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{ padding:18px 26px 14px; border-bottom:1px solid var(--line); background:var(--panel); }
  .topbar h2{ margin:0 0 3px; font-size:1.15rem; font-weight:700; }
  .topbar p{ margin:0; color:var(--ink-soft); font-size:.82rem; }
  .content{ flex:1; overflow:auto; padding:24px 26px; }

  .cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; margin-top:18px; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; display:flex; flex-direction:column; gap:8px; cursor:pointer; }
  .card:hover{ border-color:var(--thread); }
  .card .status{ font-size:.68rem; padding:2px 8px; border-radius:20px; width:fit-content; background:#EFE7D8; color:var(--ink-soft); }
  .card .status.ready{ background:#DCEBE3; color:#2F5D55; }
  .card h3{ margin:0; font-size:.95rem; }
  .card p{ margin:0; font-size:.78rem; color:var(--ink-soft); line-height:1.6; }

  .tabs{ display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
  .tab{ padding:7px 14px; border-radius:20px; font-size:.8rem; border:1px solid var(--line); background:var(--panel); color:var(--ink-soft); cursor:pointer; display:flex; gap:6px; align-items:center; }
  .tab.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .tab.disabled{ cursor:not-allowed; opacity:.55; }
  .tab .mini-badge{ font-size:.6rem; background:rgba(0,0,0,.08); padding:0 6px; border-radius:10px; }

  .controls{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:12px; align-items:flex-end; }
  .field{ display:flex; flex-direction:column; gap:4px; min-width:120px; }
  .field label{ font-size:.72rem; color:var(--ink-soft); }
  select, input[type=number]{ font-family:'Vazirmatn',sans-serif; font-size:.95rem; padding:7px 10px; border-radius:8px;
    border:1px solid var(--line); background:var(--paper); color:var(--ink); }
  input[type=number]{ width:100px; }
  .custom-fields{ display:flex; flex-wrap:wrap; gap:10px; padding:10px; border:1px dashed var(--line); border-radius:8px; margin-bottom:10px; }
  .measure-strip{ display:flex; flex-wrap:wrap; gap:14px; padding:10px 0; border-bottom:1px solid var(--line); margin-bottom:14px; font-size:.78rem; }
  .measure-strip .m{ color:var(--ink-soft); white-space:nowrap; }
  .measure-strip .m b{ color:var(--ink); font-family:'JetBrains Mono',monospace; font-weight:500; }

  .sheet{ background:linear-gradient(var(--grid) 1px, transparent 1px) 0 0/20px 20px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/20px 20px, var(--panel);
    border:1px solid var(--line); border-radius:4px; padding:24px; display:flex; justify-content:center; overflow:auto; }
  svg{ display:block; }
  .outline{ fill:none; stroke:var(--ink); stroke-width:2.2; stroke-linejoin:round; }
  .construction{ fill:none; stroke:var(--ink-soft); stroke-width:.7; stroke-dasharray:3 3; }
  .grainline{ stroke:var(--teal); stroke-width:1.2; }
  .pt{ fill:var(--thread); }
  .pt-label{ font-family:'JetBrains Mono',monospace; font-size:11px; fill:var(--ink); }
  .side-label{ font-family:'Vazirmatn',sans-serif; font-size:11px; fill:var(--ink-soft); }
  .piece-label{ font-family:'Vazirmatn',sans-serif; font-size:15px; font-weight:600; fill:var(--ink-soft); }

  .toolbar{ display:flex; gap:10px; align-items:center; margin-top:14px; flex-wrap:wrap; }
  button.primary{ font-family:'Vazirmatn',sans-serif; font-size:.85rem; padding:8px 16px; border-radius:8px; border:1px solid var(--ink); background:var(--ink); color:var(--paper); cursor:pointer; }
  button.primary:hover{ opacity:.85; }
  button.ghost{ font-family:'Vazirmatn',sans-serif; font-size:.85rem; padding:8px 16px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; }
  .note{ font-size:.78rem; color:var(--ink-soft); flex:1; min-width:220px; }

  .stub{ border:1.5px dashed var(--line); border-radius:12px; padding:36px 20px; text-align:center; color:var(--ink-soft); margin-top:10px; }
  .stub svg{ width:30px; height:30px; margin-bottom:8px; opacity:.6; }
  .stub h4{ color:var(--ink); margin:0 0 6px; font-size:.9rem; }
  .stub p{ font-size:.78rem; max-width:420px; margin:0 auto; line-height:1.7; }
  .dropzone{ border:1.5px dashed var(--line); border-radius:12px; padding:30px; text-align:center; cursor:pointer; background:var(--panel); }
  .dropzone:hover{ border-color:var(--thread); }
  .dropzone input{ display:none; }
  #photoPreview{ max-width:100%; max-height:260px; border-radius:8px; margin-top:14px; display:none; }

  .preview-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .preview-card{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; text-align:center; }
  .preview-card h4{ margin:0 0 10px; font-size:.9rem; color:var(--ink-soft); font-weight:600; }
  .preview-card svg{ margin:0 auto; }
  @media (max-width:640px){ .preview-grid{ grid-template-columns:1fr; } }

  .print-page{ background:#fff; border:1px solid var(--line); box-shadow:0 1px 4px rgba(0,0,0,.08); margin:0 auto 18px; width:fit-content; }
  .print-meta{ font-size:.78rem; color:var(--ink-soft); margin-bottom:14px; }

  @media print{
    .sidebar,.topbar,.controls,.measure-strip,.toolbar,.tabs,.print-meta,.dropzone{ display:none; }
    .content{ padding:0; overflow:visible; } .sheet{ border:none; background:none; } body{ background:#fff; }
    .print-page{ box-shadow:none; border:none; page-break-after:always; margin:0; }
  }
  @media (max-width:720px){
    .sidebar{ width:64px; } .brand h1,.brand p,.navitem span{ display:none; }
    .navitem{ justify-content:center; } .brand{ text-align:center; padding:0 6px 18px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="mark">🧵</div><h1>الگوساز کودک</h1><p>طراحی الگوی لباس بچه‌گانه</p></div>
    <nav id="nav"></nav>
  </aside>
  <div class="main">
    <div class="topbar"><h2 id="secTitle"></h2><p id="secDesc"></p></div>
    <div class="content" id="content"></div>
  </div>
</div>

<script>
const ICONS = {
  dashboard:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="10" width="8" height="11" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/></svg>',
  pattern:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4l16 16M4 20L20 4" stroke-linecap="round"/><circle cx="8" cy="8" r="1.4" fill="currentColor" stroke="none"/><circle cx="16" cy="16" r="1.4" fill="currentColor" stroke="none"/></svg>',
  photo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>',
  preview:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 4h3l2 2 2-2h3l2 4-3 2v10H8V10L5 8z"/></svg>',
  print:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="6" y="3" width="12" height="6" rx="1"/><rect x="4" y="9" width="16" height="8" rx="1.5"/><rect x="7" y="14" width="10" height="7"/></svg>'
};

const SIZES = [
  {height:92,  age:2, chest:54, backWidth:22,   neck:26.4, shoulder:7,   armDepth:12.6, backLength:22},
  {height:98,  age:3, chest:55, backWidth:22.8, neck:27,   shoulder:7.4, armDepth:13.2, backLength:23.2},
  {height:104, age:4, chest:57, backWidth:23.6, neck:27.6, shoulder:7.8, armDepth:13.8, backLength:24.4},
  {height:110, age:5, chest:59, backWidth:24.4, neck:28.2, shoulder:8.2, armDepth:14.4, backLength:25.6},
  {height:116, age:6, chest:61, backWidth:25.2, neck:28.8, shoulder:8.6, armDepth:15,   backLength:26.8},
  {height:122, age:7, chest:63, backWidth:26,   neck:29.4, shoulder:9,   armDepth:15.6, backLength:28},
];
const FIELD_LABELS = [['chest','دور سینه'],['neck','دور گردن'],['shoulder','سرشانه'],
  ['backWidth','کارورپشت'],['armDepth','بلندی حلقه آستین'],['backLength','قد بالاتنه پشت']];

function unit(p,q){ const dx=q.x-p.x, dy=q.y-p.y, len=Math.hypot(dx,dy)||1; return {x:dx/len,y:dy/len}; }
function bisectorPoint(corner,a,b,dist){
  const v1=unit(corner,a), v2=unit(corner,b);
  let bx=v1.x+v2.x, by=v1.y+v2.y; const bl=Math.hypot(bx,by)||1;
  return {x:corner.x+(bx/bl)*dist, y:corner.y+(by/bl)*dist};
}
// range: '92-122' یا '128-152' — ثابت‌های گشادی طبق فرمول‌های تأییدشدهٔ کتاب فرق می‌کنند
function computePoints(s, range){
  range = range || '92-122';
  const e = range==='128-152'
    ? {neckAdd:4.5, shoulderEase:0.5, crossAdd:1.5, sideSub:0.75, waistDrop:1}
    : {neckAdd:4,   shoulderEase:0.3, crossAdd:1,   sideSub:1,    waistDrop:1.5};
  const P={};
  P.P0={x:0,y:0}; P.P1={x:0,y:s.backLength+1.25};
  P.P2={x:s.chest/4+e.neckAdd,y:0}; P.P3={x:P.P2.x,y:P.P1.y};
  P.P4={x:0,y:1.25}; P.P5={x:0,y:P.P4.y+s.armDepth+1};
  P.P6={x:P.P2.x,y:P.P5.y};
  P.P7={x:0,y:P.P4.y+0.5*(P.P5.y-P.P4.y)+1};
  P.P8={x:0,y:P.P4.y+(s.armDepth/4-2)};
  P.P9={x:s.neck/5-0.2,y:0};
  P.P10={x:s.backWidth/2+0.5,y:P.P5.y};
  P.P11={x:P.P10.x,y:P.P7.y};
  { const drop=P.P8.y-P.P9.y, len=s.shoulder+e.shoulderEase;
    const dx=Math.sqrt(Math.max(len*len-drop*drop,0));
    P.P12={x:P.P9.x+dx,y:P.P8.y}; }
  P.P13={x:P.P2.x-(s.neck/5-0.5),y:0};
  P.P14={x:P.P2.x,y:s.neck/4-0.2};
  P.P15={x:P.P12.x,y:P.P12.y+0.5};
  { const drop=P.P15.y-P.P13.y, len=s.shoulder;
    const dx=Math.sqrt(Math.max(len*len-drop*drop,0));
    P.P16={x:P.P13.x-dx,y:P.P15.y}; }
  P.P17={x:P.P2.x,y:P.P14.y+0.5*(P.P6.y-P.P14.y)+e.crossAdd};
  { const dist5_10=P.P10.x-P.P5.x, d=dist5_10-e.sideSub;
    P.P18={x:P.P6.x-d,y:P.P6.y}; }
  P.P19={x:P.P18.x,y:P.P17.y};
  { const dx=P.P18.x-P.P15.x, dy=P.P18.y-P.P15.y;
    const dist18_15=Math.hypot(dx,dy); const seg=0.5*dist18_15+0.5;
    P.P20={x:P.P18.x,y:P.P18.y+seg}; }
  P.P21={x:P.P20.x,y:P.P1.y};
  P.P22={x:P.P3.x,y:P.P3.y+e.waistDrop};
  P.bulge12=bisectorPoint(P.P12,P.P9,P.P11,2);
  P.bulge16=bisectorPoint(P.P16,P.P13,P.P19,1.75);
  return P;
}
function backOutlineSegs(P){ return [ {cmd:'M',p:P.P1}, {cmd:'L',p:P.P4}, {cmd:'Q',c:P.P0,p:P.P9}, {cmd:'L',p:P.P12},
  {cmd:'Q',c:P.bulge12,p:P.P11}, {cmd:'T',p:P.P20}, {cmd:'L',p:P.P21}, {cmd:'L',p:P.P1}, {cmd:'Z'} ]; }
function frontOutlineSegs(P){ return [ {cmd:'M',p:P.P22}, {cmd:'L',p:P.P14}, {cmd:'Q',c:P.P2,p:P.P13}, {cmd:'L',p:P.P16},
  {cmd:'Q',c:P.bulge16,p:P.P19}, {cmd:'T',p:P.P20}, {cmd:'L',p:P.P21}, {cmd:'L',p:P.P22}, {cmd:'Z'} ]; }
function mirrorX(p,axis){ return {x:2*axis-p.x, y:p.y}; }
function segsToD(segs, tf){ tf = tf || (p=>p);
  return segs.map(s=>{
    if(s.cmd==='M') return `M ${tf(s.p).x} ${tf(s.p).y}`;
    if(s.cmd==='L') return `L ${tf(s.p).x} ${tf(s.p).y}`;
    if(s.cmd==='Q') return `Q ${tf(s.c).x} ${tf(s.c).y} ${tf(s.p).x} ${tf(s.p).y}`;
    if(s.cmd==='T') return `T ${tf(s.p).x} ${tf(s.p).y}`;
    return 'Z';
  }).join(' ');
}

const SCALE=7, MARGIN=60;
const faDigits=['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
function toFa(n){ return String(n).replace(/[0-9]/g,d=>faDigits[d]); }
const svgNS='http://www.w3.org/2000/svg';
function svgEl(tag,attrs,parent){ const el=document.createElementNS(svgNS,tag);
  for(const k in attrs) el.setAttribute(k,attrs[k]); if(parent) parent.appendChild(el); return el; }

// ============ کنترل مشترک انتخاب اندازه (استاندارد یا دلخواه) ============
function mountSizeControl(host, onChange){
  host.innerHTML = `
    <div class="controls">
      <div class="field"><label>قد / سن</label>
        <select class="szSelect">
          ${SIZES.map(s=>`<option value="${s.height}">قد ${toFa(s.height)} سانتی‌متر — حدود ${toFa(s.age)} سال</option>`).join('')}
          <option value="custom">اندازهٔ دلخواه...</option>
        </select>
      </div>
    </div>
    <div class="custom-fields" style="display:none;">
      <div class="field"><label>بازهٔ فرمول</label>
        <select class="szRange">
          <option value="92-122">۹۲ تا ۱۲۲ (کودک)</option>
          <option value="128-152">۱۲۸ تا ۱۵۲ (دخترانه، پیش از بلوغ)</option>
        </select>
      </div>
      ${FIELD_LABELS.map(([k,l])=>`<div class="field"><label>${l}</label><input type="number" step="0.1" class="szInput" data-key="${k}"></div>`).join('')}
    </div>`;
  const select=host.querySelector('.szSelect');
  const customBox=host.querySelector('.custom-fields');
  const rangeSel=host.querySelector('.szRange');
  const inputs=[...host.querySelectorAll('.szInput')];

  function fireFromPreset(h){
    const s=SIZES.find(x=>x.height===h);
    onChange(s, '92-122', `قد ${toFa(s.height)} سانتی‌متر`);
  }
  function fireFromCustom(){
    const s={}; inputs.forEach(inp=> s[inp.dataset.key]=parseFloat(inp.value)||0);
    onChange(s, rangeSel.value, 'اندازهٔ دلخواه');
  }
  function fillCustomDefaults(base){
    inputs.forEach(inp=> inp.value=base[inp.dataset.key]);
  }

  select.addEventListener('change',()=>{
    if(select.value==='custom'){
      customBox.style.display='flex';
      if(!inputs[0].value) fillCustomDefaults(SIZES.find(x=>x.height===110));
      fireFromCustom();
    } else {
      customBox.style.display='none';
      fireFromPreset(Number(select.value));
    }
  });
  rangeSel.addEventListener('change', fireFromCustom);
  inputs.forEach(inp=> inp.addEventListener('input', fireFromCustom));

  select.value=110;
  fireFromPreset(110);
}

// ============ بخش «الگوی پایه» ============
function renderBodicePattern(container, s, range, label){
  const P=computePoints(s, range);
  const pt=p=>({x:MARGIN+p.x*SCALE,y:MARGIN+p.y*SCALE});
  const width=P.P2.x*SCALE+MARGIN*2, height=P.P1.y*SCALE+MARGIN*2;
  const svg=svgEl('svg',{viewBox:`0 0 ${width} ${height}`,width,height});
  const B=k=>pt(P[k]);

  [{y:P.P0.y,label:'خط گردن'},{y:P.P8.y,label:'خط شانه پشت'},
   {y:P.P5.y,label:'بلندی حلقه/کف آستین'},{y:P.P1.y,label:'خط کمر'}].forEach(r=>{
    const a=pt({x:0,y:r.y}), b=pt({x:P.P2.x,y:r.y});
    svgEl('line',{class:'construction',x1:a.x,y1:a.y,x2:b.x,y2:b.y},svg);
    svgEl('text',{class:'side-label',x:8,y:a.y+4},svg).textContent=r.label;
  });
  svgEl('path',{class:'outline',d:segsToD(backOutlineSegs(P),pt)},svg);
  svgEl('path',{class:'outline',d:segsToD(frontOutlineSegs(P),pt)},svg);
  svgEl('line',{class:'grainline',x1:B('P20').x,y1:B('P20').y,x2:B('P21').x,y2:B('P21').y},svg);
  svgEl('text',{class:'piece-label',x:(B('P1').x+B('P20').x)/2-10,y:B('P5').y,'text-anchor':'middle'},svg).textContent='پشت';
  svgEl('text',{class:'piece-label',x:(B('P20').x+B('P2').x)/2+10,y:B('P5').y,'text-anchor':'middle'},svg).textContent='جلو';
  ['P0','P1','P2','P3','P4','P5','P6','P7','P8','P9','P10','P11','P12','P13','P14','P15','P16','P17','P18','P19','P20','P21','P22'].forEach(k=>{
    const p=B(k);
    svgEl('circle',{class:'pt',cx:p.x,cy:p.y,r:2.6},svg);
    svgEl('text',{class:'pt-label',x:p.x+5,y:p.y-5},svg).textContent=toFa(k.slice(1));
  });

  container.querySelector('.sheet').innerHTML=''; container.querySelector('.sheet').appendChild(svg);
  const strip=container.querySelector('.measure-strip');
  if(strip) strip.innerHTML = `
    <span class="m">${label||''}</span>
    <span class="m">دور سینه: <b>${toFa(s.chest)}</b></span>
    <span class="m">دور گردن: <b>${toFa(s.neck)}</b></span>
    <span class="m">سرشانه: <b>${toFa(s.shoulder)}</b></span>
    <span class="m">کارورپشت: <b>${toFa(s.backWidth)}</b></span>
    <span class="m">قد بالاتنه پشت: <b>${toFa(s.backLength)}</b></span>
    <span class="m">بلندی حلقه آستین: <b>${toFa(s.armDepth)}</b></span>`;
}

// ============ بخش «نمایش لباس» ============
function renderGarmentPreview(container, s, range){
  const P=computePoints(s, range);
  const grid=container.querySelector('.preview-grid');
  grid.innerHTML = `<div class="preview-card"><h4>نمای پشت</h4><div id="pvBack"></div></div>
                     <div class="preview-card"><h4>نمای جلو</h4><div id="pvFront"></div></div>`;
  function piece(type){
    const segs = type==='back' ? backOutlineSegs(P) : frontOutlineSegs(P);
    const axis = type==='back' ? 0 : P.P2.x;
    const pts = segs.filter(x=>x.p).map(x=>x.p).concat(segs.filter(x=>x.c).map(x=>x.c));
    const all = pts.concat(pts.map(p=>mirrorX(p,axis)));
    const minX=Math.min(...all.map(p=>p.x)), maxX=Math.max(...all.map(p=>p.x));
    const minY=Math.min(...all.map(p=>p.y)), maxY=Math.max(...all.map(p=>p.y));
    const sc=6, pad=24;
    const w=(maxX-minX)*sc+pad*2, h=(maxY-minY)*sc+pad*2;
    const tf=p=>({x:pad+(p.x-minX)*sc, y:pad+(p.y-minY)*sc});
    const svg=svgEl('svg',{viewBox:`0 0 ${w} ${h}`,width:w,height:h});
    svgEl('path',{d:segsToD(segs,tf),fill:'var(--fabric)',stroke:'var(--ink)','stroke-width':1.8,'stroke-linejoin':'round'},svg);
    svgEl('path',{d:segsToD(segs,p=>tf(mirrorX(p,axis))),fill:'var(--fabric)',stroke:'var(--ink)','stroke-width':1.8,'stroke-linejoin':'round'},svg);
    return svg;
  }
  container.querySelector('#pvBack').appendChild(piece('back'));
  container.querySelector('#pvFront').appendChild(piece('front'));
}

// ============ بخش «چاپ» ============
function renderPrintPages(container, s, range){
  const P0=computePoints(s, range);
  const M=4;
  const shifted={}; Object.keys(P0).forEach(k=> shifted[k]={x:P0[k].x+M,y:P0[k].y+M});
  const backD = segsToD(backOutlineSegs(shifted));
  const frontD = segsToD(frontOutlineSegs(shifted));
  const PAGE_W=19, PAGE_H=27, OVERLAP=1.5;
  const totalW=shifted.P2.x+M, totalH=shifted.P1.y+M;
  const cols=Math.max(1,Math.ceil(totalW/(PAGE_W-OVERLAP)));
  const rows=Math.max(1,Math.ceil(totalH/(PAGE_H-OVERLAP)));
  container.querySelector('.print-meta').textContent =
    `${toFa(rows*cols)} صفحهٔ A4 (${toFa(rows)} ردیف × ${toFa(cols)} ستون) — هر صفحه ۱.۵ سانتی‌متر هم‌پوشانی دارد؛ از روی علامت‌های + بچسبانید.`;
  const wrap=container.querySelector('#printPages'); wrap.innerHTML='';
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const x0=c*(PAGE_W-OVERLAP), y0=r*(PAGE_H-OVERLAP);
    const svg=svgEl('svg',{viewBox:`${x0} ${y0} ${PAGE_W} ${PAGE_H}`,width:PAGE_W+'cm',height:PAGE_H+'cm'});
    svgEl('path',{d:backD,fill:'none',stroke:'#2B2118','stroke-width':'0.05'},svg);
    svgEl('path',{d:frontD,fill:'none',stroke:'#2B2118','stroke-width':'0.05'},svg);
    for(let gx=0; gx<=totalW+PAGE_W; gx+=(PAGE_W-OVERLAP)){
      if(gx<x0-0.01 || gx>x0+PAGE_W+0.01) continue;
      for(let gy=0; gy<=totalH+PAGE_H; gy+=(PAGE_H-OVERLAP)){
        if(gy<y0-0.01 || gy>y0+PAGE_H+0.01) continue;
        svgEl('path',{d:`M ${gx-0.3} ${gy} L ${gx+0.3} ${gy} M ${gx} ${gy-0.3} L ${gx} ${gy+0.3}`,stroke:'#B3452F','stroke-width':'0.03'},svg);
      }
    }
    if(r===0 && c===0){
      svgEl('rect',{x:0.5,y:0.5,width:5,height:5,fill:'none',stroke:'#2F5D55','stroke-width':'0.04'},svg);
      svgEl('text',{x:0.5,y:6.1,'font-size':'0.35',fill:'#2F5D55'},svg).textContent='کنترل چاپ: این مربع باید دقیقا ۵×۵ سانتی‌متر باشد';
    }
    svgEl('text',{x:x0+0.3,y:y0+0.55,'font-size':'0.4',fill:'#6B5F4F'},svg).textContent=`صفحه ${toFa(r+1)}-${toFa(c+1)}`;
    const page=document.createElement('div'); page.className='print-page';
    page.appendChild(svg); wrap.appendChild(page);
  }
}

// ============ بخش‌های اپ ============
const SECTIONS = {
  dashboard:{ title:'داشبورد', desc:'وضعیت کلی پروژهٔ الگوساز کودک',

          پیشنهاد تقریبی الگو از روی عکس لباس می‌ده، سیلوئت کامل الگو رو نمایش می‌ده،

        </p>
        <div class="cards">
          <div class="card" data-goto="pattern"><span class="status ready">آماده</span><h3>بلوک پایهٔ بالاتنه</h3><p>محاسبه و رسم خودکار، برای اندازه‌ی استاندارد یا دلخواه.</p></div>
          <div class="card" data-goto="pattern"><span class="status">متوقف موقت</span><h3>ساسون و اصلاح منحنی حلقه</h3><p>نیاز به صفحات کتاب دارد؛ طبق درخواست، تا پایان پروژه به تعویق افتاد.</p></div>
          <div class="card" data-goto="pattern"><span class="status">متوقف موقت</span><h3>دامن، شلوار، آستین</h3><p>نیاز به فرمول‌های همون بلوک‌ها از کتاب دارد.</p></div>
          <div class="card" data-goto="photo"><span class="status ready">آماده (اولیه)</span><h3>استخراج الگو از عکس</h3><p>پیشنهاد الگو بر پایهٔ اندازهٔ انتخابی، کنار عکس لباس.</p></div>
          <div class="card" data-goto="preview"><span class="status ready">آماده</span><h3>نمایش لباس کامل</h3><p>سیلوئت کامل و قرینهٔ پشت و جلو.</p></div>
          <div class="card" data-goto="print"><span class="status ready">آماده</span><h3>چاپ ابعاد بزرگ</h3><p>خروجی چندصفحه‌ای A4 در سایز واقعی با تراز و مربع کنترل.</p></div>
        </div>`;
      el.querySelectorAll('[data-goto]').forEach(c=>c.addEventListener('click',()=>go(c.dataset.goto)));
    }
  },

  pattern:{ title:'الگوی پایه', desc:'بلوک‌های پایهٔ لباس بر اساس اندازه',
    render(el){
      el.innerHTML = `
        <div class="tabs">
          <div class="tab active">بالاتنه (پایه)</div>
          <div class="tab disabled">دامن <span class="mini-badge">نیاز به کتاب</span></div>
          <div class="tab disabled">شلوار <span class="mini-badge">نیاز به کتاب</span></div>
          <div class="tab disabled">آستین <span class="mini-badge">نیاز به کتاب</span></div>
        </div>
        <div id="szHost"></div>
        <div class="measure-strip"></div>
        <div class="sheet"></div>
        <div class="toolbar">
          <span class="note">⚠️ اصلاح منحنی حلقهٔ آستین و افزودن ساسون طبق درخواست، تا پایان پروژه به تعویق افتاده.</span>
          <button class="primary" onclick="window.print()">چاپ سریع</button>
        </div>`;
      mountSizeControl(el.querySelector('#szHost'), (s,range,label)=> renderBodicePattern(el, s, range, label));
    }
  },

  photo:{ title:'استخراج الگو از عکس', desc:'پیشنهاد الگو بر پایهٔ عکس و اندازهٔ انتخابی',
    render(el){
      el.innerHTML = `
        <div class="dropzone" id="dz">
          ${ICONS.photo}
          <p style="margin:10px 0 0;font-size:.85rem;">برای آپلود عکس لباس کلیک کن</p>
          <p style="margin:4px 0 0;font-size:.72rem;color:var(--ink-soft);">فقط برای مقایسهٔ چشمی — تحلیل خودکار تصویر هنوز اضافه نشده</p>
          <input type="file" id="fileInput" accept="image/*">
        </div>
        <img id="photoPreview">
        <div id="szHost" style="margin-top:18px;"></div>
        <p class="note" style="margin-bottom:10px;">این، بلوک پایهٔ همون اندازه‌ست؛ نه استخراج واقعی از پیکسل‌های عکس.</p>
        <div class="measure-strip"></div>
        <div class="sheet"></div>`;
      const dz=el.querySelector('#dz'), input=el.querySelector('#fileInput'), img=el.querySelector('#photoPreview');
      dz.addEventListener('click',()=>input.click());

  preview:{ title:'نمایش لباس کامل', desc:'سیلوئت کامل و قرینهٔ الگوی پشت و جلو',
    render(el){
      el.innerHTML = `<div id="szHost"></div><div class="preview-grid"></div>
        <p class="note" style="margin-top:14px;">این یه نمای تخت (Flat) و قرینه‌ست، نه شبیه‌سازی سه‌بعدی پارچه.</p>`;
      mountSizeControl(el.querySelector('#szHost'), (s,range)=> renderGarmentPreview(el, s, range));

  print:{ title:'چاپ', desc:'خروجی چندصفحه‌ای در ابعاد واقعی',

};

const nav=document.getElementById('nav');
Object.keys(SECTIONS).forEach(key=>{
  const btn=document.createElement('button'); btn.className='navitem'; btn.dataset.key=key;
  btn.innerHTML=`${ICONS[key]}<span>${SECTIONS[key].title}</span>`;
  btn.addEventListener('click',()=>go(key)); nav.appendChild(btn);
});
function go(key){
  document.querySelectorAll('.navitem').forEach(b=>b.classList.toggle('active', b.dataset.key===key));
  document.getElementById('secTitle').textContent=SECTIONS[key].title;
  document.getElementById('secDesc').textContent=SECTIONS[key].desc;
  const content=document.getElementById('content'); content.innerHTML='';
  SECTIONS[key].render(content);
}
go('dashboard');
</script>
