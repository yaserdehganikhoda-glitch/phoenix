<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>کارو</title>
<style>
:root{--bg:#f8fafc;--fg:#1e293b;--mut:#64748b;--acc:#4f46e5;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0f172a;--fg:#f1f5f9;--mut:#94a3b8;--card:#1e293b}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:Tahoma,"Vazirmatn",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;line-height:1.9}
main{max-width:420px;width:100%;background:var(--card);border-radius:24px;padding:32px 24px;text-align:center;box-shadow:0 24px 60px -24px rgba(0,0,0,.35)}
h1{font-size:24px;margin:0 0 8px}
p{color:var(--mut);margin:0 0 24px;font-size:15px}
a.btn{display:block;background:var(--acc);color:#fff;text-decoration:none;font-weight:700;padding:14px;border-radius:14px}
small{display:block;margin-top:16px;color:var(--mut);font-size:12px}
</style>
</head>
<body>
<main>
<h1>کارو</h1>
<p>ثبت کارکرد، مدیریت پرسنل و گزارش‌گیری برای همه‌ی مشاغل. این برنامه فقط به‌صورت اپ اندروید ارائه می‌شود.</p>
<a class="btn" href="https://cafebazaar.ir/app/ir.sewingstats.app">دریافت از کافه‌بازار</a>
<small>۳۰ روز اول رایگان</small>
</main>
</body>
</html>
