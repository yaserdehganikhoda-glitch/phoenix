name: Build Signed Android AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: npm install

      - name: Add Android platform (first run only)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Copy custom native Java files
        run: |
          mkdir -p android/app/src/main/java/ir/sewingstats/app
          cp android-overrides/*.java android/app/src/main/java/ir/sewingstats/app/

      - name: Install home-screen widget into android project
        run: python3 widget/apply_widget.py

      - name: Install Bazaar billing plugin (Poolakey) into android project
        run: python3 bazaar/apply_bazaar.py
        env:
          BAZAAR_SKU: kar_premium
          BAZAAR_RSA_KEY: ${{ secrets.BAZAAR_RSA_KEY }}

      - name: Add JitPack repository (required to resolve Poolakey)
        run: |
          python3 - <<'PYEOF'
          import re, os

          def add_jitpack(path):
              if not os.path.exists(path):
                  print(f"skip (not found): {path}")
                  return
              with open(path, encoding='utf-8') as f:
                  content = f.read()
              if 'jitpack.io' in content:
                  print(f"already present: {path}")
                  return
              new_content, n = re.subn(
                  r'repositories\s*\{',
                  "repositories {\n        maven { url 'https://jitpack.io' }",
                  content
              )
              if n > 0:
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write(new_content)
                  print(f"updated {path} ({n} block(s))")
              else:
                  print(f"no 'repositories {{' block found in: {path}")

          for p in ['android/settings.gradle', 'android/build.gradle', 'android/app/build.gradle']:
              add_jitpack(p)
          PYEOF
          echo "----- settings.gradle -----"
          cat android/settings.gradle 2>/dev/null || echo "(missing)"
          echo "----- app/build.gradle -----"
          cat android/app/build.gradle 2>/dev/null || echo "(missing)"

      - name: Download offline vendor files (Tailwind, Font Awesome, Persian fonts)
        run: node fetch-vendor.mjs www

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Generate app icon & splash screen from assets/icon.png
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#4f46e5' --splashBackgroundColor '#f8fafc'

      - name: Harden release build (no backup, R8 shrink)
        run: |
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' android/app/src/main/AndroidManifest.xml
          sed -i '/buildTypes/,/^    }/ s/minifyEnabled false/minifyEnabled true/' android/app/build.gradle
          cat >> android/app/proguard-rules.pro <<'EOF2'
          -keep class ir.sewingstats.app.** { *; }
          -keep class com.getcapacitor.** { *; }
          -keep @com.getcapacitor.annotation.CapacitorPlugin class * { *; }
          -keepclassmembers class * { @com.getcapacitor.PluginMethod public *; }
          -keep class ir.cafebazaar.** { *; }
          -keep class com.farsitel.bazaar.** { *; }
          -dontwarn **
          EOF2
          grep -n "allowBackup" android/app/src/main/AndroidManifest.xml
          grep -n "minifyEnabled" android/app/build.gradle

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build unsigned release AAB
        run: cd android && ./gradlew bundleRelease

      - name: Build unsigned release APK (permanent — signed with the real keystore below)
        run: cd android && ./gradlew assembleRelease

      - name: Build debug APK (for direct install/testing on your own phone)
        run: cd android && ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-for-testing
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Sign AAB
        uses: r0adkll/sign-android-release@v1
        id: sign
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Sign release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: signed-app-bundle
          path: ${{ steps.sign.outputs.signedReleaseFile }}

      - name: Upload signed permanent APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk-permanent
          path: ${{ steps.sign_apk.outputs.signedReleaseFile }}

    
