name: Build Signed Android AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: npm install

      - name: Add Android platform (first run only)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Generate app icon & splash screen from assets/icon.png
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#4f46e5' --splashBackgroundColor '#f8fafc'

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build unsigned release AAB
        run: cd android && ./gradlew bundleRelease

      - name: Sign AAB
        uses: r0adkll/sign-android-release@v1
        id: sign
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: signed-app-bundle
          path: ${{ steps.sign.outputs.signedReleaseFile }}

      - name: Commit generated android/ folder back (first run only)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add android
          git diff --staged --quiet || git commit -m "chore: add generated android project"
          git push || true
