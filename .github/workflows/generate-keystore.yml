name: Generate Signing Keystore (run once)

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: "نام Alias کلید (مثلاً sewingapp)"
        required: true
        default: "sewingapp"
      store_password:
        description: "رمز Keystore (حتماً یادداشت کن)"
        required: true
      key_password:
        description: "رمز کلید (می‌تواند همان رمز Keystore باشد)"
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "${{ inputs.key_alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ inputs.store_password }}" \
            -keypass "${{ inputs.key_password }}" \
            -dname "CN=SewingStatsApp, OU=Dev, O=SewingStatsApp, L=Tehran, ST=Tehran, C=IR"
          base64 -w 0 release.keystore > release.keystore.base64.txt

      - name: Upload keystore artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keystore-files
          path: |
            release.keystore
            release.keystore.base64.txt
